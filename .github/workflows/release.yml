name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and publish, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.7"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Verify tag matches project version
        shell: pwsh
        run: |
          $Expected = $env:RELEASE_TAG.Substring(1)
          $Project = Get-Content -Raw -LiteralPath .\pyproject.toml
          if ($Project -notmatch '(?m)^version\s*=\s*"([^"]+)"\s*$') {
            throw "Project version was not found."
          }
          if ($Matches[1] -ne $Expected) {
            throw "Tag version does not match pyproject.toml."
          }

      - name: Verify and build release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          uv lock --check
          uv sync --frozen --group build
          uv run --frozen python -m unittest discover -q
          uv run --frozen python -m compileall -q .\codexbar .\codexbar.pyw .\codexbar_dashboard.pyw .\test_codexbar.py .\test_pricing.py .\test_taskbar_display.py
          .\scripts\build_exe.ps1

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $NotesPath = Join-Path .\docs\releases "$($env:RELEASE_TAG).md"
          $NotesArguments = @("--generate-notes")
          if (Test-Path -LiteralPath $NotesPath) {
            $NotesArguments = @("--notes-file", $NotesPath)
          }
          gh release create $env:RELEASE_TAG `
            .\dist\CodexBar-Windows-x64.zip `
            .\dist\CodexBar-Windows-x64.zip.sha256 `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --title "CodexBar $env:RELEASE_TAG" `
            @NotesArguments
