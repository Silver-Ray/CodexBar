name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.7"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Verify lock file
        run: uv lock --check

      - name: Sync locked environment
        run: uv sync --frozen --group build

      - name: Run tests
        run: uv run --frozen python -m unittest discover -q

      - name: Compile Python sources
        run: uv run --frozen python -m compileall -q .\codexbar .\codexbar.pyw .\codexbar_dashboard.pyw .\test_codexbar.py .\test_pricing.py .\test_taskbar_display.py

      - name: Build and audit Windows release
        shell: pwsh
        run: .\scripts\build_exe.ps1

      - name: Upload audited Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CodexBar-Windows-x64
          path: |
            dist/CodexBar-Windows-x64.zip
            dist/CodexBar-Windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
